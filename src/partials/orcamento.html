<section id="orcamento">
<div class="wrap">
<hr class="rule">
<h2>Pedir orçamento</h2>
<p class="lead">Preencha o formulário. O pedido abre no WhatsApp, pronto a enviar à equipa comercial.</p>
<form id="qf" novalidate>
<label>Nome completo<input name="nome" required autocomplete="name"><span class="err"></span></label>
<label>Empresa (opcional)<input name="empresa" autocomplete="organization"></label>
<label>Telefone<input name="tel" type="tel" required autocomplete="tel"><span class="err"></span></label>
<label>Email (opcional)<input name="email" type="email" autocomplete="email"></label>
<label>Província<select name="prov" required><option value="">Seleccione</option></select><span class="err"></span></label>
<label>Município<input name="mun" required><span class="err"></span></label>
<label class="full">Modalidade<select name="mod"><option>Compra</option><option>Aluguer</option><option>Recuperação de peça</option><option>Ainda não sei</option></select></label>
<label class="full">Tipo de entrega<select name="ent"><option>Levantamento no Lubango</option><option>Entrega na Huíla</option><option>Entrega interprovincial</option></select></label>
<label>Categoria<select name="cat" id="catsel" required><option value="">Seleccione</option></select><span class="err"></span></label>
<label>Quantidade<input name="qtd" type="number" min="1" required><span class="err"></span></label>
<label>Tamanhos e cores<input name="tc" placeholder="Ex.: M e L, azul-marinho"></label>
<label>Personalização<input name="pers" placeholder="Ex.: logótipo bordado no peito"></label>
<label class="full">Descrição adicional<textarea name="desc" rows="3"></textarea></label>
<input name="site" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
<div class="full"><button class="btn gold" type="submit">Enviar pedido por WhatsApp</button></div>
</form>
<div id="ok" role="status">Pedido preparado. Envie no WhatsApp e anexe, na mesma conversa, o logótipo ou a imagem de referência.</div>
</div>
</section>
